<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Gaming World - High Quality WebRTC Voice</title>
    <!-- FontAwesome & Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- PeerJS for Reliable Voice WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

    <style>
        :root {
            --primary: #8a2be2;
            --accent: #ff007f;
            --gold: #ffd700;
            --bg-dark: #0f0c20;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1a153a, var(--bg-dark));
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .m-coin {
            width: 35px;
            height: 35px;
            background: radial-gradient(circle at 30% 30%, #fff7a0, var(--gold), #b8860b);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #5c3a00;
            font-weight: 900;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(255, 215, 0, 0.5), inset 0 0 5px #fff;
            border: 2px solid #fff;
            transform-style: preserve-3d;
            animation: rotateCoin 4s infinite linear;
        }

        @keyframes rotateCoin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .card-3d {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        #auth-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-box {
            width: 380px;
            padding: 30px;
            text-align: center;
        }

        .auth-box input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 12px;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            outline: none;
        }

        .auth-box button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
        }

        #main-app {
            display: none;
            padding-bottom: 80px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0,0,0,0.4);
        }

        .user-profile-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            object-fit: cover;
            cursor: pointer;
        }

        .games-section {
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .game-card {
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .game-card:hover { transform: translateY(-5px); }

        .rps-hands-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 80px;
            margin: 25px 0;
            min-height: 120px;
        }

        .action-choice-btn {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            background: rgba(255,255,255,0.15);
            color: #fff;
            transition: all 0.2s;
        }

        .action-choice-btn:hover {
            background: var(--accent);
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-content {
            width: 95%;
            max-width: 650px;
            padding: 25px;
            max-height: 95vh;
            overflow-y: auto;
            position: relative;
        }

        .mic-btn {
            background: #2ed573;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .mic-btn.muted { background: #ff4757; }

        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .admin-table th, .admin-table td { padding: 10px; border: 1px solid rgba(255,255,255,0.1); text-align: center; font-size: 12px; }
        .status-dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        .online { background: #2ed573; }
        .offline { background: #ff4757; }
    </style>
</head>
<body>

    <!-- Remote Audio Player -->
    <audio id="remote-audio" autoplay playsinline></audio>

    <!-- AUTH SCREEN -->
    <div id="auth-screen">
        <div class="auth-box card-3d">
            <h2 style="color: var(--gold);"><i class="fa-solid fa-gamepad"></i> مرحباً بك!</h2>
            <input type="text" id="auth-username" placeholder="اسم الحساب">
            <input type="password" id="auth-password" placeholder="كلمة السر">
            <button onclick="handleLogin()">تسجيل الدخول</button>
            <button onclick="handleRegister()" style="background: rgba(255,255,255,0.1);">إنشاء حساب جديد</button>
            <p id="auth-error" style="color: #ff4757; font-size: 13px; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app">
        <div class="navbar card-3d">
            <div class="user-profile-header">
                <img id="my-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=Mahmoud" class="profile-img">
                <div>
                    <h4 id="display-name" style="margin: 0;">-</h4>
                    <span id="display-id" style="font-size: 12px; color: var(--gold);">ID: ----</span>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.3); padding: 8px 15px; border-radius: 20px;">
                <span id="display-coins" style="font-weight: bold; font-size: 18px;">0</span>
                <div class="m-coin">M</div>
            </div>
        </div>

        <div id="admin-trigger" style="display: none; padding: 0 20px; margin-top: 10px;">
            <button onclick="openAdminModal()" style="width: 100%; padding: 10px; background: #ff9f43; border: none; border-radius: 10px; font-weight: bold; color: #000; cursor: pointer;">
                <i class="fa-solid fa-user-shield"></i> فتح لوحة التحكم الأدمن
            </button>
        </div>

        <h3 style="padding: 0 20px; margin-top: 20px;"><i class="fa-solid fa-trophy"></i> الألعاب المتاحة</h3>
        <div class="games-section">
            <div class="game-card card-3d" onclick="openGameRPS()">
                <h2 style="color: var(--gold); margin-bottom: 10px;">طوبة ورقة مقص (صوت مباشر 🎙️)</h2>
                <div style="font-size: 65px; margin: 15px 0;">✊ ✋ ✌️</div>
                <p>تحدَّ أصدقاءك مع الصوت المباشر بجودة عالية ومضمونة!</p>
            </div>
        </div>
    </div>

    <!-- RPS GAME MODAL -->
    <div id="rps-modal" class="modal">
        <div class="modal-content card-3d" style="text-align: center;">
            <h3 style="color: var(--gold);">🎮 حلبة الصوت والتحدي</h3>
            
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span id="voice-status" style="font-size: 13px; color: #aaa;">المايك متوقف</span>
                <button class="mic-btn muted" id="mic-toggle-btn" onclick="togglePeerVoice()"><i class="fa-solid fa-microphone"></i> تشغيل المايك</button>
            </div>

            <div class="rps-hands-container">
                <div>
                    <div id="p1-hand" class="hand-box">🤛</div>
                    <small id="p1-name-tag" style="font-size: 13px; color: var(--gold);">أنت</small>
                </div>
                <span style="font-size: 30px; color: var(--accent);">VS</span>
                <div>
                    <div id="p2-hand" class="hand-box">🤜</div>
                    <small id="p2-name-tag" style="font-size: 13px; color: #1e90ff;">الخصم</small>
                </div>
            </div>

            <div style="display: flex; justify-content: space-around; gap: 10px; margin-top: 20px;">
                <button class="action-choice-btn" onclick="playRpsAction('rock')">✊ طوبة</button>
                <button class="action-choice-btn" onclick="playRpsAction('paper')">✋ ورقة</button>
                <button class="action-choice-btn" onclick="playRpsAction('scissors')">✌️ مقص</button>
            </div>

            <button onclick="closeModal('rps-modal')" style="margin-top: 20px; background: #ff4757; border: none; padding: 8px 15px; border-radius: 8px; color: #fff; font-weight: bold;">خروج</button>
        </div>
    </div>

    <!-- ADMIN MODAL -->
    <div id="admin-modal" class="modal">
        <div class="modal-content card-3d">
            <h3>لوحة تحكم الأدمن (خاصة بـ Mahmoud)</h3>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>الحالة</th>
                        <th>اسم الحساب</th>
                        <th>كلمة السر</th>
                        <th>ID</th>
                        <th>العملات</th>
                        <th>إجراءات التحكم</th>
                    </tr>
                </thead>
                <tbody id="admin-users-list"></tbody>
            </table>
            <button onclick="closeModal('admin-modal')" style="margin-top: 20px; background: #ff4757; border: none; padding: 8px 15px; border-radius: 8px; color: #fff;">إغلاق</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://vortex-259f7-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = null;
        let peer = null;
        let localStream = null;
        let isMicActive = false;

        function handleLogin() {
            const user = document.getElementById('auth-username').value.trim().toLowerCase();
            const pass = document.getElementById('auth-password').value.trim();

            db.ref('users/' + user).once('value', snapshot => {
                if (snapshot.exists() && snapshot.val().password === pass) {
                    currentUser = snapshot.val();
                    document.getElementById('auth-screen').style.display = 'none';
                    document.getElementById('main-app').style.display = 'block';
                    document.getElementById('display-name').innerText = currentUser.username;
                    document.getElementById('display-coins').innerText = currentUser.coins || 0;
                    
                    if (currentUser.username === 'mahmoud') {
                        document.getElementById('admin-trigger').style.display = 'block';
                    }
                    initPeerJS();
                } else {
                    alert("خطأ في البيانات!");
                }
            });
        }

        function handleRegister() {
            const user = document.getElementById('auth-username').value.trim().toLowerCase();
            const pass = document.getElementById('auth-password').value.trim();
            if (!user || !pass) return alert("املاً البيانات!");

            const userData = { username: user, password: pass, coins: 50, online: true };
            db.ref('users/' + user).set(userData);
            currentUser = userData;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('display-name').innerText = currentUser.username;
            document.getElementById('display-coins').innerText = 50;

            if (currentUser.username === 'mahmoud') {
                document.getElementById('admin-trigger').style.display = 'block';
            }
            initPeerJS();
        }

        // --- ⚙️ ADMIN PANEL CONTROLS ---
        function openAdminModal() {
            document.getElementById('admin-modal').style.display = 'flex';
            db.ref('users').on('value', snapshot => {
                const tbody = document.getElementById('admin-users-list');
                tbody.innerHTML = '';
                snapshot.forEach(child => {
                    const u = child.val();
                    tbody.innerHTML += `
                        <tr>
                            <td><span class="status-dot ${u.online ? 'online' : 'offline'}"></span></td>
                            <td>${u.username}</td>
                            <td>${u.password}</td>
                            <td>${u.id || '----'}</td>
                            <td>${u.coins || 0}</td>
                            <td>
                                <button onclick="adminSendCoins('${u.username}')" style="background:#2ed573; border:none; padding:4px 8px; border-radius:4px; color:#fff; cursor:pointer;">+ عملات</button>
                                <button onclick="adminZeroCoins('${u.username}')" style="background:#ff4757; border:none; padding:4px 8px; border-radius:4px; color:#fff; cursor:pointer; margin-right:3px;">🔄 تصفير</button>
                                <button onclick="adminChangeId('${u.username}')" style="background:#1e90ff; border:none; padding:4px 8px; border-radius:4px; color:#fff; cursor:pointer; margin-right:3px;">تغيير ID</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        function adminSendCoins(targetUser) {
            const amount = prompt("أدخل عدد العملات لإضافتها:");
            if (amount && !isNaN(amount)) {
                db.ref('users/' + targetUser + '/coins').transaction(c => (c || 0) + parseInt(amount));
            }
        }

        // 🔄 NEW: ZERO COINS FUNCTION FOR ADMIN
        function adminZeroCoins(targetUser) {
            if (confirm(`هل أنت تأكد من تصفير عملات الحساب (${targetUser})؟`)) {
                db.ref('users/' + targetUser + '/coins').set(0);
                alert(`تم تصفير عملات ${targetUser} بنجاح!`);
            }
        }

        function adminChangeId(targetUser) {
            const newId = prompt("أدخل ID الجديد (4 أرقام):");
            if (newId && newId.length === 4) {
                db.ref('users/' + targetUser + '/id').set(newId);
                db.ref('ids/' + newId).set(targetUser);
                alert("تم تحديث ID بنجاح!");
            }
        }

        // --- 🎙️ PeerJS High Quality Voice Streaming ---
        function initPeerJS() {
            peer = new Peer('mgaming_user_' + currentUser.username);

            peer.on('call', call => {
                navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then(stream => {
                    localStream = stream;
                    call.answer(stream);
                    call.on('stream', remoteStream => {
                        const audioEl = document.getElementById('remote-audio');
                        audioEl.srcObject = remoteStream;
                        document.getElementById('voice-status').innerText = "🔊 الصوت المباشر شغال مع الخصم!";
                    });
                });
            });
        }

        async function togglePeerVoice() {
            const micBtn = document.getElementById('mic-toggle-btn');
            const targetUser = prompt("أدخل اسم الخصم للاتصال بصوته المباشر:");

            if (!targetUser) return;

            if (!isMicActive) {
                try {
                    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                    isMicActive = true;
                    micBtn.classList.remove('muted');
                    micBtn.innerHTML = `<i class="fa-solid fa-microphone"></i> المايك متصل 🟢`;

                    const call = peer.call('mgaming_user_' + targetUser.toLowerCase(), localStream);
                    call.on('stream', remoteStream => {
                        const audioEl = document.getElementById('remote-audio');
                        audioEl.srcObject = remoteStream;
                        document.getElementById('voice-status').innerText = "🔊 متصل صوتيًا مع " + targetUser;
                    });
                } catch (err) {
                    alert("يرجى إعطاء الصلاحية للميكروفون!");
                }
            } else {
                if (localStream) localStream.getTracks().forEach(track => track.stop());
                isMicActive = false;
                micBtn.classList.add('muted');
                micBtn.innerHTML = `<i class="fa-solid fa-microphone"></i> تشغيل المايك`;
                document.getElementById('voice-status').innerText = "المايك متوقف";
            }
        }

        function openGameRPS() { document.getElementById('rps-modal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
